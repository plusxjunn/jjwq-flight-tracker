name: track

on:
  # The on-time run (09:07 SGT) is started by a Claude scheduled task using mode "scheduled".
  # GitHub's own cron is unreliable (hours late or dropped), so it is only a backup here;
  # --skip-if-done makes it a no-op when today's run already happened.
  schedule:
    - cron: "37 3 * * *"      # 11:37 SGT backup
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        default: run
        options:
          - run            # normal run
          - scheduled      # used by the daily Claude scheduled task: skip if today's run already happened
          - preview        # real searches (all of them); every guest message goes to the admin chat
          - announce       # post announcement.html to the guest channel
          - factcheck      # one-off: airline-direct prices from Google's booking step (~10 searches)
          - run-digest     # normal run + weekly digest now
          - dry-run        # sample data, no API calls, prints messages only
          - test-admin     # send a test message to the admin chat
          - welcome        # post + pin the welcome message in the guest channel

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run
        run: |
          case "${{ github.event_name }}:${{ inputs.mode }}" in
            schedule:*)              python main.py --skip-if-done ;;
            *:scheduled)             python main.py --skip-if-done ;;
            *:run-digest)            python main.py --digest ;;
            *:preview)               python main.py --preview ;;
            *:announce)              python main.py --announce announcement.html ;;
            *:factcheck)             python factcheck.py ;;
            *:dry-run)               python main.py --dry-run --digest ;;
            *:test-admin)            python main.py --test-admin ;;
            *:welcome)               python main.py --welcome ;;
            *)                       python main.py ;;
          esac

      - name: Commit data and report
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data docs samples
          git add data docs samples
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) run"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
