# One-off: live SerpApi calls to capture sample responses for --dry-run.
# Manual trigger only. Each search = 1 SerpApi call.
name: probe
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Live calls (flex + one-ways, nonstop, no airline filter)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        shell: python
        run: |
          import base64, gzip, json, os, requests
          key = os.environ["SERPAPI_KEY"].strip()
          base = dict(engine="google_flights", currency="SGD", gl="sg", hl="en", adults="1",
                      travel_class="1", stops="1", api_key=key)
          searches = {
            "flex": dict(departure_id="SIN", arrival_id="DPS", outbound_date="2027-09-02", return_date="2027-09-06", type="1"),
            "out_wed": dict(departure_id="SIN", arrival_id="DPS", outbound_date="2027-09-01", type="2"),
            "out_fri": dict(departure_id="SIN", arrival_id="DPS", outbound_date="2027-09-03", type="2"),
            "back_sun": dict(departure_id="DPS", arrival_id="SIN", outbound_date="2027-09-05", type="2"),
            "back_mon": dict(departure_id="DPS", arrival_id="SIN", outbound_date="2027-09-06", type="2"),
          }
          for sid, p in searches.items():
              r = requests.get("https://serpapi.com/search.json", params={**base, **p}, timeout=60)
              text = r.text.replace(key, "***")
              data = json.loads(text)
              print(f"##### {sid} HTTP {r.status_code} error={data.get('error')}")
              for g in ("best_flights", "other_flights"):
                  for it in data.get(g, []):
                      l = it["flights"][0]
                      print(f"  {sid} S${it.get('price')} {l.get('flight_number')} {l['departure_airport']['time']}->{l['arrival_airport']['time']}")
              os.makedirs("samples", exist_ok=True)
              open(f"samples/{sid}.json", "w").write(json.dumps(data, indent=1))
      - name: Push samples to probe-samples branch
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe-samples
          git add samples
          git commit -m "probe: sample responses"
          git push -f origin probe-samples
