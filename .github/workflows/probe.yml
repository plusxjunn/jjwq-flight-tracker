# One-off: makes a single live SerpApi call for the `core` trip so we can see
# which carriers appear on SIN-DPS. Manual trigger only. Costs 1 search.
name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Live call (core round-trip, nonstop, no airline filter)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        shell: python
        run: |
          import base64, gzip, json, os, requests
          key = os.environ["SERPAPI_KEY"]
          params = dict(engine="google_flights", departure_id="SIN", arrival_id="DPS",
                        outbound_date="2027-09-03", return_date="2027-09-05", type="1",
                        currency="SGD", gl="sg", hl="en", adults="1", travel_class="1",
                        stops="1", api_key=key)
          r = requests.get("https://serpapi.com/search.json", params=params, timeout=60)
          print("HTTP", r.status_code)
          text = r.text.replace(key, "***")
          data = json.loads(text)
          blob = base64.b64encode(gzip.compress(text.encode())).decode()
          print("=====RAW_GZ_B64_BEGIN=====")
          for i in range(0, len(blob), 900):
              print(blob[i:i+900])
          print("=====RAW_GZ_B64_END=====")
          print("error:", data.get("error"))
          print("price_insights:", json.dumps(data.get("price_insights", {}), indent=1)[:1500])
          print("google_flights_url:", data.get("search_metadata", {}).get("google_flights_url"))
          for group in ("best_flights", "other_flights"):
              for it in data.get(group, []):
                  legs = it.get("flights", [])
                  print(group, "| S$", it.get("price"), "|",
                        " + ".join(f'{l.get("airline")} {l.get("flight_number")} '
                                   f'{l["departure_airport"]["time"]}->{l["arrival_airport"]["time"]}'
                                   for l in legs))
